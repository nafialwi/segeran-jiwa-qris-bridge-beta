name: Build Segeran Jiwa QRIS Bridge Beta v0.1.1

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/qris-signal-beta ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BRIDGE_KEYSTORE_PASSWORD: ${{ secrets.BRIDGE_KEYSTORE_PASSWORD }}
      BRIDGE_KEY_ALIAS: ${{ secrets.BRIDGE_KEY_ALIAS }}
      BRIDGE_KEY_PASSWORD: ${{ secrets.BRIDGE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate signing secrets and restore keystore
        env:
          BRIDGE_KEYSTORE_B64: ${{ secrets.BRIDGE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$BRIDGE_KEYSTORE_B64"
          test -n "$BRIDGE_KEYSTORE_PASSWORD"
          test -n "$BRIDGE_KEY_ALIAS"
          test -n "$BRIDGE_KEY_PASSWORD"

          export BRIDGE_KEYSTORE_PATH="$RUNNER_TEMP/segeran-jiwa-qris-bridge.jks"
          printf 'BRIDGE_KEYSTORE_PATH=%s\n' "$BRIDGE_KEYSTORE_PATH" >> "$GITHUB_ENV"

          printf '%s' "$BRIDGE_KEYSTORE_B64" | base64 --decode > "$BRIDGE_KEYSTORE_PATH"
          chmod 600 "$BRIDGE_KEYSTORE_PATH"
          keytool -list \
            -keystore "$BRIDGE_KEYSTORE_PATH" \
            -storepass "$BRIDGE_KEYSTORE_PASSWORD" \
            -alias "$BRIDGE_KEY_ALIAS" >/dev/null

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Align, sign, and verify release APK
        env:
          EXPECTED_CERT_SHA256: 2F9C280769BF6054278FE683D9B793965C47C9C4360E951B0DC702AE1E662695
        run: |
          set -euo pipefail

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          FINAL_APK="release/Segeran-Jiwa-QRIS-Bridge-v0.1.1-beta.apk"
          ALIGNED_APK="$RUNNER_TEMP/Segeran-Jiwa-QRIS-Bridge-v0.1.1-beta-aligned.apk"

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "::error::Unsigned release APK not found at $UNSIGNED_APK"
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error::Android build-tools directory not found: $SDK_ROOT/build-tools"
            exit 1
          fi

          BUILD_TOOLS_VERSION="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          ZIPALIGN="$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          APKSIGNER="$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          test -x "$ZIPALIGN" || { echo "::error::zipalign not executable at $ZIPALIGN"; exit 1; }
          test -x "$APKSIGNER" || { echo "::error::apksigner not executable at $APKSIGNER"; exit 1; }

          echo "Using Android build-tools: $BUILD_TOOLS_VERSION"
          mkdir -p release

          "$ZIPALIGN" -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          "$APKSIGNER" sign \
            --ks "$BRIDGE_KEYSTORE_PATH" \
            --ks-key-alias "$BRIDGE_KEY_ALIAS" \
            --ks-pass "env:BRIDGE_KEYSTORE_PASSWORD" \
            --key-pass "env:BRIDGE_KEY_PASSWORD" \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          "$ZIPALIGN" -c -v 4 "$FINAL_APK"
          "$APKSIGNER" verify --verbose --print-certs "$FINAL_APK"

          ACTUAL_CERT_SHA256="$(
            "$APKSIGNER" verify --print-certs "$FINAL_APK" \
              | sed -n -E 's/.*certificate SHA-256 digest:[[:space:]]*([0-9a-fA-F]+).*/\1/p' \
              | head -n 1 \
              | tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$ACTUAL_CERT_SHA256" ]; then
            echo "::error::Could not read signing certificate SHA-256 digest from final APK"
            exit 1
          fi

          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signed by unexpected certificate"
            echo "Expected: $EXPECTED_CERT_SHA256"
            echo "Actual:   $ACTUAL_CERT_SHA256"
            exit 1
          fi

          sha256sum "$FINAL_APK" > "$FINAL_APK.sha256"
          echo "APK signature valid and signing certificate matches pinned Bridge identity."
          cat "$FINAL_APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Segeran-Jiwa-QRIS-Bridge-v0.1.1-beta-signed
          path: |
            release/Segeran-Jiwa-QRIS-Bridge-v0.1.1-beta.apk
            release/Segeran-Jiwa-QRIS-Bridge-v0.1.1-beta.apk.sha256
